<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Color Palette Generator</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="app-header">
    <button
      type="button"
      class="theme-toggle-btn"
      id="themeToggleBtn"
      aria-pressed="false"
      aria-label="Toggle dark mode"
    >
      <i class="fa-solid fa-moon" aria-hidden="true"></i>
    </button>

    <h1 class="app-title">Color Palette Generator</h1>
    <p class="app-subtitle">Generate beautiful color combinations instantly.</p>
  </header>

  <main class="app-main">

    <section class="controls-section" aria-label="Palette controls">
      <button type="button" class="generate-btn" id="generateBtn">
        <i class="fa-solid fa-wand-magic-sparkles" aria-hidden="true"></i>
        Generate Palette
      </button>
    </section>

    <section class="palette-section" aria-label="Color palette results">
      <div class="palette-grid">

        <article class="color-card" data-card-index="0">
          <button
            type="button"
            class="lock-btn"
            data-lock-btn
            data-locked="false"
            aria-pressed="false"
            aria-label="Lock this color"
          >
            <i class="fa-solid fa-lock-open" aria-hidden="true"></i>
          </button>
          <div class="color-preview" data-preview style="background-color:#FFFFFF;"></div>
          <button type="button" class="hex-value" data-hex aria-label="Copy hex code">#FFFFFF</button>
        </article>

        <article class="color-card" data-card-index="1">
          <button
            type="button"
            class="lock-btn"
            data-lock-btn
            data-locked="false"
            aria-pressed="false"
            aria-label="Lock this color"
          >
            <i class="fa-solid fa-lock-open" aria-hidden="true"></i>
          </button>
          <div class="color-preview" data-preview style="background-color:#FFFFFF;"></div>
          <button type="button" class="hex-value" data-hex aria-label="Copy hex code">#FFFFFF</button>
        </article>

        <article class="color-card" data-card-index="2">
          <button
            type="button"
            class="lock-btn"
            data-lock-btn
            data-locked="false"
            aria-pressed="false"
            aria-label="Lock this color"
          >
            <i class="fa-solid fa-lock-open" aria-hidden="true"></i>
          </button>
          <div class="color-preview" data-preview style="background-color:#FFFFFF;"></div>
          <button type="button" class="hex-value" data-hex aria-label="Copy hex code">#FFFFFF</button>
        </article>

        <article class="color-card" data-card-index="3">
          <button
            type="button"
            class="lock-btn"
            data-lock-btn
            data-locked="false"
            aria-pressed="false"
            aria-label="Lock this color"
          >
            <i class="fa-solid fa-lock-open" aria-hidden="true"></i>
          </button>
          <div class="color-preview" data-preview style="background-color:#FFFFFF;"></div>
          <button type="button" class="hex-value" data-hex aria-label="Copy hex code">#FFFFFF</button>
        </article>

        <article class="color-card" data-card-index="4">
          <button
            type="button"
            class="lock-btn"
            data-lock-btn
            data-locked="false"
            aria-pressed="false"
            aria-label="Lock this color"
          >
            <i class="fa-solid fa-lock-open" aria-hidden="true"></i>
          </button>
          <div class="color-preview" data-preview style="background-color:#FFFFFF;"></div>
          <button type="button" class="hex-value" data-hex aria-label="Copy hex code">#FFFFFF</button>
        </article>

      </div>
    </section>

  </main>

  <footer class="app-footer">
    <p>Built with HTML, CSS and JavaScript</p>
  </footer>

  <!-- Toast notification container: single, reusable, off unrelated flow -->
  <div class="toast-container" id="toastContainer" aria-live="polite" aria-atomic="true"></div>

  <script src="script.js"></script>
</body>
</html>
